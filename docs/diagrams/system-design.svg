<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Abhas Production System Design &amp; Vertical Slice Architecture</title>
  <desc id="desc">Animated system design showing Next.js 16 frontend, FastAPI security middleware onion, 9 vertical feature slices, hexagonal ports and adapters, SQLite WAL / Postgres storage, LightGBM CPU inference, Open-Meteo adapter, and Gemini/Claude LLM adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1A5C"/>
      <stop offset="100%" stop-color="#08102C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12215E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B1338" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="royalBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F5BFF"/>
      <stop offset="100%" stop-color="#1C3EC7"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B8EFF"/>
      <stop offset="100%" stop-color="#D4F53C"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .t-h1   { font-family: "Poppins", "Segoe UI", system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; }
      .t-sub  { font-family: "Poppins", "Segoe UI", system-ui, sans-serif; font-weight: 500; fill: #C8D4F4; }
      .t-lbl  { font-family: "Poppins", "Segoe UI", system-ui, sans-serif; font-weight: 700; fill: #D4F53C; font-size: 10.5px; letter-spacing: 0.08em; }
      .t-name { font-family: "Poppins", "Segoe UI", system-ui, sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 13px; }
      .t-sm   { font-family: "Poppins", "Segoe UI", system-ui, sans-serif; font-weight: 400; fill: #C5D1F0; font-size: 10.5px; }
      .t-chip { font-family: "Poppins", "Segoe UI", system-ui, sans-serif; font-weight: 600; fill: #FFFFFF; font-size: 10.5px; }
      .wire-base { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 2; }
      .wire-anim { fill: none; stroke: url(#beam); stroke-width: 2.2; stroke-dasharray: 6 6; animation: flowV 1.3s linear infinite; }
      .ring-pulse { animation: ringBeat 3s ease-in-out infinite; }
      @keyframes flowV {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes ringBeat {
        0%, 100% { stroke-opacity: 0.35; }
        50%      { stroke-opacity: 0.9; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1160" height="560" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1158" height="558" rx="21" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" class="t-h1" font-size="20">ABHAS — Production System Design (Modular Monolith · Ports &amp; Adapters)</text>
  <text x="36" y="64" class="t-sub" font-size="12">ADR-0001 Vertical-Slice Architecture · 9 API Slices · 11 Web Slices · Zero Cross-Slice Imports</text>

  <!-- LAYER 1: CLIENT / PRESENTATION -->
  <rect x="36" y="86" width="1088" height="90" rx="16" fill="url(#panel)" stroke="rgba(255,255,255,0.18)"/>
  <text x="54" y="108" class="t-lbl">CLIENT LAYER · NEXT.JS 16 (APP ROUTER · TURBOPACK · TAILWIND V4 · POPPINS + NOTO SANS BENGALI)</text>
  <g>
    <rect x="54" y="118" width="195" height="44" rx="10" fill="rgba(47,91,255,0.22)" stroke="rgba(107,142,255,0.45)"/>
    <text x="68" y="137" class="t-name" font-size="12">Landing &amp; Public Pages</text>
    <text x="68" y="153" class="t-sm">Rain Clock · EN/বাংলা · /docs /status</text>

    <rect x="264" y="118" width="215" height="44" rx="10" fill="url(#royalBox)" stroke="rgba(255,255,255,0.3)"/>
    <text x="278" y="137" class="t-name" font-size="12">Operations Console (/dashboard)</text>
    <text x="278" y="153" class="t-sm" fill="#EEF3FF">8 Tabs · MapLibre · Recharts · A4</text>

    <rect x="494" y="118" width="195" height="44" rx="10" fill="rgba(47,91,255,0.22)" stroke="rgba(107,142,255,0.45)"/>
    <text x="508" y="137" class="t-name" font-size="12">Abhas AI Chat Widget</text>
    <text x="508" y="153" class="t-sm">SSE Streaming · Grounded Ward Ctx</text>

    <rect x="704" y="118" width="190" height="44" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
    <text x="718" y="137" class="t-name" font-size="12">Server Proxy (/api/ops)</text>
    <text x="718" y="153" class="t-sm">Keeps OPS_TOKEN off browser</text>

    <rect x="909" y="118" width="197" height="44" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
    <text x="923" y="137" class="t-name" font-size="12">Clerk Auth (Optional)</text>
    <text x="923" y="153" class="t-sm">Zero-key open mode when unset</text>
  </g>

  <!-- Vertical Animated Connections: Client -> Middleware -->
  <path id="c1" d="M 370 176 L 370 212" class="wire-base"/><path d="M 370 176 L 370 212" class="wire-anim"/>
  <path id="c2" d="M 590 176 L 590 212" class="wire-base"/><path d="M 590 176 L 590 212" class="wire-anim"/>
  <path id="c3" d="M 800 176 L 800 212" class="wire-base"/><path d="M 800 176 L 800 212" class="wire-anim"/>
  <circle r="3.5" fill="#D4F53C" filter="url(#glow)"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
  <circle r="3.5" fill="#6B8EFF" filter="url(#glow)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
  <circle r="3.5" fill="#D4F53C" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#c3"/></animateMotion></circle>

  <!-- LAYER 2: FASTAPI SECURITY MIDDLEWARE ONION -->
  <rect x="36" y="212" width="1088" height="62" rx="14" fill="rgba(47,91,255,0.14)" stroke="#2F5BFF" stroke-width="1.4" class="ring-pulse"/>
  <text x="54" y="233" class="t-lbl">FASTAPI SECURITY MIDDLEWARE ONION (OUTERMOST &#x2192; INNERMOST)</text>
  <text x="54" y="256" class="t-chip">CORS Allowlist  &#x2192;  Security Headers (CSP/HSTS/Frame)  &#x2192;  Request-ID Logging  &#x2192;  Rate Limiter (120/min · 20/min LLM)  &#x2192;  64 KiB Body Cap  &#x2192;  RFC 9457 Errors</text>

  <!-- Vertical Animated Connections: Middleware -> Slices -->
  <path id="m1" d="M 240 274 L 240 304" class="wire-base"/><path d="M 240 274 L 240 304" class="wire-anim"/>
  <path id="m2" d="M 580 274 L 580 304" class="wire-base"/><path d="M 580 274 L 580 304" class="wire-anim"/>
  <path id="m3" d="M 920 274 L 920 304" class="wire-base"/><path d="M 920 274 L 920 304" class="wire-anim"/>

  <!-- LAYER 3: 9 VERTICAL FEATURE SLICES -->
  <rect x="36" y="304" width="1088" height="100" rx="16" fill="url(#panel)" stroke="rgba(255,255,255,0.18)"/>
  <text x="54" y="326" class="t-lbl">DOMAIN VERTICAL SLICES (apps/api/app/features/* — FRAMEWORK-FREE SERVICES, ZERO CROSS-SLICE IMPORTS)</text>
  <g>
    <rect x="54"  y="338" width="110" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="64"  y="359" class="t-name" font-size="11.5">wards</text>
    <text x="64"  y="376" class="t-sm">GET /wards</text>

    <rect x="172" y="338" width="110" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="182" y="359" class="t-name" font-size="11.5">lags</text>
    <text x="182" y="376" class="t-sm">GET /lags</text>

    <rect x="290" y="338" width="122" height="50" rx="10" fill="rgba(47,91,255,0.3)" stroke="#6B8EFF"/>
    <text x="300" y="359" class="t-name" font-size="11.5">forecast</text>
    <text x="300" y="376" class="t-sm">POST /forecast</text>

    <rect x="420" y="338" width="116" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="430" y="359" class="t-name" font-size="11.5">heatmap</text>
    <text x="430" y="376" class="t-sm">GET /heatmap</text>

    <rect x="544" y="338" width="116" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="554" y="359" class="t-name" font-size="11.5">validation</text>
    <text x="554" y="376" class="t-sm">GET /validation</text>

    <rect x="668" y="338" width="112" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="678" y="359" class="t-name" font-size="11.5">weather</text>
    <text x="678" y="376" class="t-sm">GET /weather</text>

    <rect x="788" y="338" width="110" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="798" y="359" class="t-name" font-size="11.5">advisory</text>
    <text x="798" y="376" class="t-sm">POST /advisory</text>

    <rect x="906" y="338" width="104" height="50" rx="10" fill="rgba(47,91,255,0.3)" stroke="#6B8EFF"/>
    <text x="916" y="359" class="t-name" font-size="11.5">chat</text>
    <text x="916" y="376" class="t-sm">POST /chat</text>

    <rect x="1018" y="338" width="88" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="1028" y="359" class="t-name" font-size="11.5">ops</text>
    <text x="1028" y="376" class="t-sm">GET /ops</text>
  </g>

  <!-- Vertical Animated Connections: Slices -> Adapters -->
  <path id="a1" d="M 160 404 L 160 438" class="wire-base"/><path d="M 160 404 L 160 438" class="wire-anim"/>
  <path id="a2" d="M 435 404 L 435 438" class="wire-base"/><path d="M 435 404 L 435 438" class="wire-anim"/>
  <path id="a3" d="M 715 404 L 715 438" class="wire-base"/><path d="M 715 404 L 715 438" class="wire-anim"/>
  <path id="a4" d="M 990 404 L 990 438" class="wire-base"/><path d="M 990 404 L 990 438" class="wire-anim"/>
  <circle r="3.5" fill="#D4F53C" filter="url(#glow)"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
  <circle r="3.5" fill="#6B8EFF" filter="url(#glow)"><animateMotion dur="1.3s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
  <circle r="3.5" fill="#D4F53C" filter="url(#glow)"><animateMotion dur="1.7s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
  <circle r="3.5" fill="#6B8EFF" filter="url(#glow)"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#a4"/></animateMotion></circle>

  <!-- LAYER 4: HEXAGONAL ADAPTERS & INFRASTRUCTURE -->
  <g>
    <rect x="36" y="438" width="256" height="94" rx="14" fill="url(#panel)" stroke="rgba(255,255,255,0.18)"/>
    <text x="52" y="460" class="t-lbl">PERSISTENCE ADAPTER</text>
    <text x="52" y="482" class="t-name">SQLite WAL / PostgreSQL</text>
    <text x="52" y="500" class="t-sm">Alembic 0001_initial · 6 tables</text>
    <text x="52" y="516" class="t-sm">observations, caches, llm_traces</text>

    <rect x="310" y="438" width="256" height="94" rx="14" fill="url(#panel)" stroke="rgba(47,91,255,0.7)"/>
    <text x="326" y="460" class="t-lbl">ML INFERENCE ADAPTER</text>
    <text x="326" y="482" class="t-name">LightGBM CPU Engine</text>
    <text x="326" y="500" class="t-sm">current.joblib (954 KiB, loaded 1x)</text>
    <text x="326" y="516" class="t-sm">0.59 ms/ward · TreeSHAP drivers</text>

    <rect x="584" y="438" width="256" height="94" rx="14" fill="url(#panel)" stroke="rgba(255,255,255,0.18)"/>
    <text x="600" y="460" class="t-lbl">WEATHER ADAPTER</text>
    <text x="600" y="482" class="t-name">Open-Meteo (CC BY 4.0)</text>
    <text x="600" y="500" class="t-sm">1 batched 5-city GET / 6h TTL</text>
    <text x="600" y="516" class="t-sm">Retries + Breaker + Climatology</text>

    <rect x="858" y="438" width="266" height="94" rx="14" fill="url(#panel)" stroke="rgba(255,255,255,0.18)"/>
    <text x="874" y="460" class="t-lbl">LLM ADAPTERS (OPTIONAL)</text>
    <text x="874" y="482" class="t-name">Gemini 2.5 Flash · Haiku</text>
    <text x="874" y="500" class="t-sm">Dual-key 429 failover · $1/day cap</text>
    <text x="874" y="516" class="t-sm">Offline deterministic fallback</text>
  </g>
</svg>
